<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12251E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Daftar akun · TGEP Scan</title>
<style>
:root{--dark:#12251E;--green:#1E9E69;--g2:#137A50;--orange:#E8892B;--bg:#F6F7F2;--card:#FDFDFA;--red:#C8281F;--muted:#5A6A62}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:#1C2B25;font-size:16px}
header{background:var(--dark);color:#fff;padding:12px 16px calc(12px) ;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header img{width:34px;height:34px;background:#fff;border-radius:8px;padding:2px} header b{font-size:17px} header .sp{flex:1}
#net{font-size:12px;padding:3px 8px;border-radius:10px;background:#2f4a3f} #net.off{background:var(--red)}
main{padding:14px;max-width:1100px;margin:0 auto}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
h2{font-size:18px;margin:0 0 10px} h3{font-size:15px;margin:0 0 8px}
label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid #c9d1cb;border-radius:8px;font-size:16px;background:#fff}
button{border:0;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:600;background:var(--green);color:#fff;cursor:pointer}
button.sec{background:#e3e8e1;color:var(--dark)} button.warn{background:var(--orange)} button.danger{background:var(--red)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap} .row>*{flex:1}
.big{display:grid;grid-template-columns:1fr;gap:10px} .big button{padding:18px;font-size:17px;text-align:left}
.big small{display:block;font-weight:400;opacity:.85;font-size:13px}
.list{list-style:none;padding:0;margin:0} .list li{padding:10px 0;border-bottom:1px solid #e6ebe5;display:flex;gap:10px;align-items:center}
.pill{font-size:12px;padding:3px 8px;border-radius:10px;background:#e3e8e1;white-space:nowrap}
.pill.NEEDS_REVIEW{background:#FBE6D0;color:#6E3A08} .pill.APPROVED{background:#DCEFE4;color:#0F4F35} .pill.ERROR,.pill.REJECTED{background:#F6C9C3;color:#8A1C12} .pill.PROCESSING,.pill.UPLOADED,.pill.ANTRE{background:#dfe7f5;color:#1d3a7a}
.muted{color:var(--muted);font-size:13px}
.err{color:var(--red);font-size:14px;margin-top:6px}
nav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap} nav button{flex:1;background:#e3e8e1;color:var(--dark);padding:10px} nav button.on{background:var(--dark);color:#fff}
/* review */
.rv{display:grid;grid-template-columns:1fr;gap:12px} @media(min-width:900px){.rv{grid-template-columns:1fr 1fr}}
.photo{position:relative;overflow:auto;height:60vh;background:#222;border-radius:10px;touch-action:pan-x pan-y pinch-zoom}
.photo img{transform-origin:0 0;display:block}
.tw{overflow:auto;max-height:70vh} table{border-collapse:collapse;font-size:13px}
th{position:sticky;top:0;background:var(--dark);color:#fff;padding:6px;font-weight:600;white-space:nowrap;z-index:1}
td{border:1px solid #dde3dc;padding:0} td input{border:0;border-radius:0;padding:6px;font-size:14px;min-width:58px;width:100%}
td.f-BEDA input{background:#FFE7A8} td.f-ATURAN input,td.f-x input{background:#F6C9C3} td.edited input{background:#DCEFE4}
.flags li{font-size:13px} .flags li b{color:var(--red)}
.ab{display:flex;gap:6px;margin-top:4px} .ab button{padding:6px 10px;font-size:13px}
.hide{display:none}
</style>
</head>
<body>
<header><img src="icon-192.png" alt=""><b>TGEP Scan · Pendaftaran</b><span class="sp"></span></header>
<main id="app">
<div class="card"><h2>Daftar akun pengguna</h2>
<p class="muted">Isi data Anda. Setelah mendaftar, akun <b>menunggu persetujuan admin TGEP</b> sebelum bisa memakai aplikasi.</p>
<label>Nama lengkap *</label><input id="fn" autocomplete="name">
<label>Email *</label><input id="em" type="email" autocomplete="email">
<label>No. HP / WhatsApp *</label><input id="ph" type="tel" autocomplete="tel">
<label>Perusahaan *</label><input id="co" placeholder="mis. PT Terra Grapindo Eco Prima / kontraktor bor">
<label>Jabatan *</label><input id="po" placeholder="mis. Wellsite geologist, helper bor, QC data">
<label>Peran yang diminta</label><select id="rl"><option value="driller">Driller / kru kontraktor bor</option><option value="geologist">Geologist / wellsite TGEP</option><option value="verifier">Verifier data</option><option value="client">Client (lihat laporan rig &amp; dashboard)</option></select>
<div id="pjBox"><label>Proyek tempat bertugas</label><select id="pj"><option value="">— memuat… —</option></select>
<label id="rgLbl">Rig</label><div id="rgBox" class="row" style="gap:14px"></div>
<p class="muted" id="rgTip">Usulan saja. Admin yang menetapkan proyek & rig Anda; setelah disetujui tidak bisa diubah sendiri.</p></div>
<label>Keterangan</label><input id="rs" placeholder="mis. helper bor, shift malam">
<label>Kata sandi * (min. 8 karakter, jangan sama dengan sandi email)</label><input id="pw" type="password" autocomplete="new-password">
<label>Ulangi kata sandi *</label><input id="pw2" type="password" autocomplete="new-password">
<div style="margin-top:12px"><button id="go">Daftar</button></div>
<div id="e" class="err"></div>
<p class="muted" style="margin-top:12px">Sudah punya akun? <a href="./">Masuk ke aplikasi</a></p>
</div>
</main>
<script type="module" src="daftar.js"></script>
</body></html>
